name: abdulrehman_video_editor
description: "AbdulRehman Video Editor - AI Speed Curve & Auto 60s Mobile App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Icons & Modern UI
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  font_awesome_flutter: ^10.7.0
  
  # On-Device YouTube Download & Metadata
  youtube_explode_dart: ^2.2.1
  
  # Mobile On-Device FFmpeg Engine (GPL with all audio/video filters)
  ffmpeg_kit_flutter_full_gpl: ^6.0.3
  
  # Media Picker, File Management & Paths
  file_picker: ^8.0.0
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  path: ^1.9.0
  permission_handler: ^11.3.0
  gal: ^2.3.0 # Modern gallery saver
  
  # In-App Video Player
  video_player: ^2.8.2
  chewie: ^1.7.4 # Premium video controls
  
  # Progress, Animations & UI Utils
  flutter_spinkit: ^5.2.0
  intl: ^0.19.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
