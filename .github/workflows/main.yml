name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Auto Locate Project & Build APK
        run: |
          if [ -f "pubspec.yaml" ]; then
            TARGET_DIR="."
          elif [ -f "flutter_video_editor/pubspec.yaml" ]; then
            TARGET_DIR="flutter_video_editor"
          else
            TARGET_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          fi
          echo "Building Flutter APK in: $TARGET_DIR"
          cd "$TARGET_DIR"
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AbdulRehman-VideoEditor-APK
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
